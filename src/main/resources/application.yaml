spring:
  profiles:
    active: local

  security:
    filter:
      dispatcher-types: request, error, async

  datasource:
    url: jdbc:mysql://localhost:3307/study_tracker?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
   init:
     mode: always
     schema-location: classpath:schema.sql


  jpa:
    hibernate:
     ddl-auto: none
    show-sql: true
    properties:
     hibernate:
        format_sql: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000    # 30분
  refresh-token-expiration: 604800000 # 7일

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}